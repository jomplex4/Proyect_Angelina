name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and install NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "ndk;28.0.12916984"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12916984" >> "$GITHUB_ENV"

      - name: Restore Giac AAR cache
        id: giac-cache
        uses: actions/cache@v4
        with:
          path: app/libs/giac-android.aar
          key: giac-aar-${{ hashFiles('scripts/build-giac.sh') }}

      # Best effort: if Giac fails, the APK still builds and the app reports "math engine not installed".
      - name: Build Giac AAR
        if: steps.giac-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-giac.sh 2>&1 | tee giac-build.log

      - name: Upload Giac build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giac-build-log
          path: giac-build.log
          if-no-files-found: ignore

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug

      # Release builds use R8 and the baseline profile and are much faster on a phone than debug builds.
      - name: Assemble release APKs
        continue-on-error: true
        run: ./gradlew assembleRelease

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: angelina-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: angelina-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: angelina-*

      - name: Create GitHub Release (release APKs if they exist, otherwise debug)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          if ls dist/angelina-release-apk/*.apk >/dev/null 2>&1; then
            cp dist/angelina-release-apk/*.apk "out/ANGELINA-${TAG}.apk"
          else
            cp dist/angelina-debug-apk/*.apk "out/ANGELINA-${TAG}-debug.apk"
          fi
          ls -la out
          gh release create "$TAG" out/*.apk --title "ANGELINA $TAG" --generate-notes
