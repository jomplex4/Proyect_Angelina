name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[67]|ndk;28" || true
          "$SDKMANAGER" "platform-tools" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache Giac AAR
        id: giac-cache
        uses: actions/cache@v4
        with:
          path: app/libs/giac-android.aar
          key: giac-aar-${{ hashFiles('scripts/build-giac.sh') }}

      # Best effort: if Giac fails, the APK still builds and the app reports "math engine not installed".
      - name: Build Giac AAR
        if: steps.giac-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ./scripts/build-giac.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: angelina-debug-apk
          path: app/build/outputs/apk/debug/*.apk