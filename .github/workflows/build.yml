name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358" "build-tools;36.0.0"

      - name: Cache Giac AAR
        id: giac-cache
        uses: actions/cache@v4
        with:
          path: app/libs/giac-android.aar
          key: giac-aar-${{ hashFiles('scripts/build-giac.sh') }}

      # Best effort: if Giac fails to build, the app still compiles and reports "math engine not installed".
      - name: Build Giac AAR
        if: steps.giac-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./scripts/build-giac.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: angelina-debug-apk
          path: app/build/outputs/apk/debug/*.apk
